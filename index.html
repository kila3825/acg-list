<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的 ACG 與閱讀作品庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .tab-active { background-color: #9333ea !important; color: #ffffff !important; font-weight: 600; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-7xl mx-auto">

  <!-- 頁首與搜尋 -->
  <header class="mb-6 text-center md:text-left flex flex-col md:flex-row justify-between items-center gap-4">
    <div>
      <h1 class="text-3xl font-bold text-purple-400 flex items-center gap-2">
        📚 我的 ACG & 閱讀紀錄庫
      </h1>
      <p class="text-slate-400 text-sm mt-1">Google Sheets 即時連動展示版</p>
    </div>
    <input type="text" id="searchInput" placeholder="🔍 搜尋作品名稱、備註或日期..." 
           class="w-full md:w-80 px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-purple-500 shadow-inner">
  </header>

  <!-- 狀態分類篩選列 -->
  <div id="tabs" class="flex flex-wrap gap-2 mb-6 border-b border-slate-800 pb-4">
    <button onclick="filterTab('ALL')" class="tab-btn tab-active px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-sm transition-all">🌟 全部</button>
    <button onclick="filterTab('HEART')" class="tab-btn px-3.5 py-1.5 rounded-lg bg-pink-900/40 text-pink-300 hover:bg-pink-800/60 text-sm border border-pink-700/50 transition-all font-semibold">💖 心頭好 (愛心作品)</button>
    <button onclick="filterTab('正在看')" class="tab-btn px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-sm transition-all">📺 正在看</button>
    <button onclick="filterTab('比較想看')" class="tab-btn px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-sm transition-all">🔥 比較想看</button>
    <button onclick="filterTab('想看')" class="tab-btn px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-sm transition-all">📌 想看</button>
    <button onclick="filterTab('看完結局')" class="tab-btn px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-sm transition-all">🎉 看完結局</button>
    <button onclick="filterTab('看完')" class="tab-btn px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-sm transition-all">⏳ 看完 (等下一季/就到這裡)</button>
    <button onclick="filterTab('一半不看')" class="tab-btn px-3.5 py-1.5 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 text-sm transition-all">⏸️ 一半不看的</button>
  </div>

  <!-- 統計數據 -->
  <div class="text-sm text-slate-400 mb-4 flex justify-between items-center" id="stats">
    <span>⏳ 資料載入中...</span>
  </div>

  <!-- 作品卡片牆 -->
  <div id="cardGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

  <script>
    // ⚠️ 請替換為你的 Google 試算表 CSV 連結 (發布到 Web 取得的 CSV 網址)
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTxFXMuSviPYQBVdCvuMtSwP18lI_he7qtN_4bL9j_BsZnismoC-nEuH-txAtFaog/pub?output=csv';

    let allData = [];
    let currentFilter = 'ALL';

    function loadData() {
      Papa.parse(csvUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            allData = results.data;
            document.getElementById('stats').innerText = `✅ 成功載入 ${allData.length} 項作品`;
            renderCards();
          } else {
            document.getElementById('stats').innerHTML = '<span class="text-yellow-400">⚠️ 讀取到空資料，請檢查試算表公開發布權限。</span>';
          }
        },
        error: function(err) {
          document.getElementById('stats').innerHTML = '<span class="text-red-400">❌ 讀取失敗，請確認 CSV 網址是否正確。</span>';
        }
      });
    }

    function renderCards() {
      const grid = document.getElementById('cardGrid');
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      grid.innerHTML = '';

      const filtered = allData.filter(item => {
        // 相容不同欄位命名
        const title = item['作品名稱'] || item['子狀態/細項'] || item['名稱'] || item['類別'] || '';
        const subStatus = item['狀態/分區'] || item['子狀態/細項'] || item['狀態'] || '';
        const mainCat = item['主分區'] || item['類別'] || '';
        const note = item['進度/備註'] || item['備註'] || '';
        const date = item['看完或記錄日期/備註'] || '';

        // 愛心標記判斷
        const isHeart = title.includes('💓') || note.includes('💓') || date.includes('💓') || subStatus.includes('💓');

        // 分頁篩選條件
        let matchFilter = false;
        if (currentFilter === 'ALL') {
          matchFilter = true;
        } else if (currentFilter === 'HEART') {
          matchFilter = isHeart;
        } else {
          matchFilter = subStatus.includes(currentFilter) || mainCat.includes(currentFilter);
        }

        // 關鍵字搜尋條件
        const matchSearch = title.toLowerCase().includes(search) || 
                            note.toLowerCase().includes(search) || 
                            subStatus.toLowerCase().includes(search) ||
                            date.toLowerCase().includes(search);

        return matchFilter && matchSearch;
      });

      document.getElementById('stats').innerText = `顯示 ${filtered.length} 項作品（總計 ${allData.length} 項）`;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">尚無符合條件的作品數據</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-slate-800/90 border border-slate-700/60 p-4 rounded-xl flex flex-col justify-between hover:border-purple-500/60 hover:shadow-purple-900/20 hover:shadow-lg transition-all';

        const title = item['作品名稱'] || item['子狀態/細項'] || item['名稱'] || item['類別'] || '未命名作品';
        const subStatus = item['狀態/分區'] || item['子狀態/細項'] || item['狀態'] || '';
        const note = item['進度/備註'] || item['備註'] || '';
        const mainCat = item['主分區'] || item['類別'] || '';
        const date = item['看完或記錄日期/備註'] || '';
        const isHeart = title.includes('💓') || note.includes('💓') || date.includes('💓') || subStatus.includes('💓');

        const tagHtml = (subStatus && subStatus.trim() !== '') 
          ? `<span class="text-xs px-2 py-0.5 rounded bg-purple-900/60 text-purple-300 font-medium border border-purple-700/40">${subStatus}</span>` 
          : '';

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2 gap-2">
              <div class="flex flex-wrap gap-1">${tagHtml}</div>
              ${isHeart ? '<span class="text-pink-400 text-base flex-shrink-0">💓</span>' : ''}
            </div>
            <h3 class="font-bold text-lg text-slate-100 mb-2 leading-snug">${title}</h3>
            ${note ? `<p class="text-sm text-slate-400 mb-3 leading-relaxed">${note}</p>` : ''}
          </div>
          <div class="text-xs text-slate-500 pt-2 border-t border-slate-700/40 flex justify-between items-center mt-2">
            <span>${mainCat}</span>
            <span class="text-slate-400">${date}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterTab(filterName) {
      currentFilter = filterName;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('tab-active');
      });
      event.currentTarget.classList.add('tab-active');
      renderCards();
    }

    document.getElementById('searchInput').addEventListener('input', renderCards);
    loadData();
  </script>
</body>
</html>
